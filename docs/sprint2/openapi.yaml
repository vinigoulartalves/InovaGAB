openapi: 3.0.3
info:
  title: InovaGAB API Sprint 2
  description: |
    API REST do InovaGAB — contrato etapa 1 (especificação).
    Prefixo de negócio `/api/v1`. JSON camelCase. Concorrência via `versao` e `If-Match` em DELETE lógico.
  version: 1.0.0
  contact:
    name: InovaGAB FIAP
  license:
    name: Proprietary
    url: https://github.com/vinigoulartalves/InovaGAB
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
tags:
  - name: Auth
  - name: Usuarios
  - name: Estrategias
  - name: Ideias
  - name: Projetos
  - name: Relatorios
  - name: Ranking
  - name: Ia
  - name: Health
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login com email e senha
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              operador:
                value:
                  email: operador1@inovagab.local
                  senha: DevPassword1!
      responses:
        '200':
          description: Autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Renovar access token (rotação de refresh)
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens renovados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revogar refresh token (idempotente)
      operationId: authLogout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Sessão encerrada
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Perfil do usuário autenticado
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResumo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/usuarios/responsaveis:
    get:
      tags: [Usuarios]
      summary: Lista mínima de gestores ativos
      operationId: listResponsaveis
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Gestores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResponsavelResumo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/estrategias:
    get:
      tags: [Estrategias]
      summary: Listar estratégias
      operationId: listEstrategias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: vigente
          in: query
          schema:
            type: boolean
        - name: categoria
          in: query
          schema:
            type: string
        - name: campanha
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Página de estratégias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEstrategiaResumo'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Estrategias]
      summary: Criar estratégia (LIDER)
      operationId: createEstrategia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstrategiaCreateRequest'
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstrategiaDetalhe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/estrategias/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Estrategias]
      summary: Detalhe da estratégia
      operationId: getEstrategia
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalhe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstrategiaDetalhe'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Estrategias]
      summary: Atualizar estratégia (LIDER)
      operationId: updateEstrategia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstrategiaUpdateRequest'
      responses:
        '200':
          description: Atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstrategiaDetalhe'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Estrategias]
      summary: Exclusão lógica (LIDER)
      operationId: deleteEstrategia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Excluída logicamente
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/estrategias/{id}/historico:
    get:
      tags: [Estrategias]
      summary: Histórico imutável da estratégia
      operationId: getEstrategiaHistorico
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Histórico paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedEstrategiaHistorico'
  /api/v1/ideias:
    get:
      tags: [Ideias]
      summary: Listar ideias
      operationId: listIdeias
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusIdeia'
        - name: prioridade
          in: query
          schema:
            $ref: '#/components/schemas/PrioridadeIdeia'
        - name: estrategiaId
          in: query
          schema:
            type: string
        - name: autorId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Página
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedIdeiaResumo'
    post:
      tags: [Ideias]
      summary: Cadastrar ideia (OPERADOR)
      operationId: createIdeia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeiaCreateRequest'
            examples:
              nova:
                value:
                  titulo: Reduzir tempo de abastecimento
                  descricao: Proposta de checklist digital
                  area: Operações
                  estrategiaId: est-vigente-001
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaDetalhe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Estratégia não vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/ideias/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Ideias]
      summary: Detalhe da ideia
      operationId: getIdeia
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalhe da ideia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaDetalhe'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Ideias]
      summary: Editar ideia (dono, ENVIADA)
      operationId: updateIdeia
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeiaUpdateRequest'
      responses:
        '200':
          description: Ideia atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaDetalhe'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Ideias]
      summary: Exclusão lógica (dono, ENVIADA)
      operationId: deleteIdeia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Excluída
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ideias/{id}/avaliacao:
    patch:
      tags: [Ideias]
      summary: Avaliar ideia (GESTOR)
      operationId: avaliarIdeia
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdeiaAvaliacaoRequest'
      responses:
        '200':
          description: Ideia avaliada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdeiaDetalhe'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ideias/{id}/projeto:
    post:
      tags: [Ideias]
      summary: Converter ideia aprovada em projeto (GESTOR)
      operationId: converterIdeiaProjeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversaoIdeiaProjetoRequest'
            examples:
              conversao:
                value:
                  versao: 4
                  nome: Automação de checklist
                  descricao: Projeto derivado da ideia aprovada
                  responsavelId: usr-gestor-001
                  etapa: Planejamento
                  status: PLANEJADO
                  investimento: 1000
                  retornoFinanceiro: 1500
                  reducaoCustos: 0
                  ganhoProdutividade: 12.5
                  prazo: 2026-12-31
      responses:
        '201':
          description: Projeto criado e ideia em VIROU_PROJETO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoDetalhe'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/ideias/{id}/analises-ia:
    post:
      tags: [Ia]
      summary: Solicitar análise IA (GESTOR)
      operationId: criarAnaliseIa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '201':
          description: Análise criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnaliseIaDetalhe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Ia]
      summary: Histórico de análises IA
      operationId: listAnalisesIa
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Histórico paginado de análises
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAnaliseIaResumo'
  /api/v1/projetos:
    get:
      tags: [Projetos]
      summary: Listar projetos
      operationId: listProjetos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StatusProjeto'
        - name: estrategiaId
          in: query
          schema:
            type: string
        - name: inicio
          in: query
          schema:
            type: string
            format: date
        - name: fim
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Página de projetos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjetoResumo'
    post:
      tags: [Projetos]
      summary: Criar projeto direto (GESTOR)
      operationId: createProjeto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjetoCreateRequest'
      responses:
        '201':
          description: Projeto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoDetalhe'
  /api/v1/projetos/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Projetos]
      summary: Detalhe do projeto
      operationId: getProjeto
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Detalhe do projeto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoDetalhe'
    put:
      tags: [Projetos]
      summary: Atualizar projeto (GESTOR)
      operationId: updateProjeto
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjetoUpdateRequest'
      responses:
        '200':
          description: Projeto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjetoDetalhe'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Projetos]
      summary: Exclusão lógica (GESTOR)
      operationId: deleteProjeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Excluído
  /api/v1/relatorios/dashboard:
    get:
      tags: [Relatorios]
      summary: Dashboard consolidado (LIDER)
      operationId: getDashboard
      security:
        - bearerAuth: []
      parameters:
        - name: estrategiaId
          in: query
          schema:
            type: string
        - name: projetoId
          in: query
          schema:
            type: string
        - name: inicio
          in: query
          schema:
            type: string
            format: date
        - name: fim
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Dashboard consolidado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardRelatorio'
              examples:
                seedAB:
                  summary: Cenário seed A+B
                  value:
                    investimentoTotal: 3000
                    retornoTotal: 4100
                    lucroTotal: 1100
                    roiPercentual: 36.6667
                    reducaoCustosTotal: 0
                    ganhoProdutividadeMedio: 10
                    projetosAtrasados: 0
                    investimentoRetornoPorEstrategia:
                      - estrategiaId: est-001
                        estrategiaTitulo: Estratégia Demo
                        investimento: 3000
                        retorno: 4100
                    distribuicaoPorStatus:
                      - status: EM_ANDAMENTO
                        quantidade: 2
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/relatorios/estrategias:
    get:
      tags: [Relatorios]
      summary: Relatório por estratégia (LIDER)
      operationId: getRelatorioEstrategias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Relatório agrupado por estratégia
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatorioEstrategiaItem'
  /api/v1/relatorios/projetos/{id}:
    get:
      tags: [Relatorios]
      summary: Relatório de um projeto (LIDER)
      operationId: getRelatorioProjeto
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Relatório do projeto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatorioProjetoDetalhe'
  /api/v1/ranking:
    get:
      tags: [Ranking]
      summary: Ranking de pontuação
      operationId: getRanking
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ranking de pontuação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingResponse'
  /health/live:
    get:
      tags: [Health]
      summary: Liveness
      operationId: healthLive
      security: []
      responses:
        '200':
          description: Processo ativo
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness (Mongo)
      operationId: healthReady
      security: []
      responses:
        '200':
          description: Pronto
        '503':
          description: Dependências indisponíveis
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: criadoEm:desc
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versão de concorrência esperada (weak ETag W/"{versao}")
      schema:
        type: string
        example: W/"3"
  responses:
    BadRequest:
      description: Validação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Sem permissão
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Conflito de negócio ou concorrência
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            concorrencia:
              value:
                title: Conflito de versão
                status: 409
                code: CONCORRENCIA
                detail: A versão informada está desatualizada.
            transicao:
              value:
                title: Transição inválida
                status: 409
                code: TRANSICAO_STATUS_INVALIDA
    TooManyRequests:
      description: Rate limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    ServiceUnavailable:
      description: Serviço externo indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    Perfil:
      type: string
      enum: [OPERADOR, GESTOR, LIDER]
    StatusIdeia:
      type: string
      enum: [ENVIADA, EM_ANALISE, APROVADA, REJEITADA, VIROU_PROJETO]
    PrioridadeIdeia:
      type: string
      enum: [BAIXA, MEDIA, ALTA]
    StatusProjeto:
      type: string
      enum: [PLANEJADO, EM_ANDAMENTO, CONCLUIDO, CANCELADO]
    PrioridadeSugeridaIa:
      type: string
      enum: [BAIXA, MEDIA, ALTA]
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 8
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    UsuarioResumo:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
        email:
          type: string
        perfil:
          $ref: '#/components/schemas/Perfil'
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
    ResponsavelResumo:
      type: object
      properties:
        id:
          type: string
        nome:
          type: string
    PagedResultBase:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    EstrategiaResumo:
      type: object
      properties:
        id:
          type: string
        titulo:
          type: string
        categoria:
          type: string
        campanha:
          type: string
        inicioVigencia:
          type: string
          format: date
        fimVigencia:
          type: string
          format: date
          nullable: true
        ativa:
          type: boolean
        vigente:
          type: boolean
        versao:
          type: integer
    EstrategiaDetalhe:
      allOf:
        - $ref: '#/components/schemas/EstrategiaResumo'
        - type: object
          properties:
            descricao:
              type: string
            excluidaEm:
              type: string
              format: date-time
              nullable: true
            criadoEm:
              type: string
              format: date-time
            atualizadoEm:
              type: string
              format: date-time
    PagedEstrategiaResumo:
      allOf:
        - $ref: '#/components/schemas/PagedResultBase'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/EstrategiaResumo'
    EstrategiaCreateRequest:
      type: object
      required: [titulo, descricao, categoria, campanha, inicioVigencia, ativa]
      properties:
        titulo:
          type: string
          maxLength: 200
        descricao:
          type: string
          maxLength: 4000
        categoria:
          type: string
        campanha:
