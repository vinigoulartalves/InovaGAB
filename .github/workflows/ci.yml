# CI local/remoto: não implica aprovação manual nem execução bem-sucedida até o workflow rodar no GitHub.
name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test (Mongo rs0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          global-json-file: backend/global.json

      - name: Docker Compose — Mongo + test-runner
        run: |
          chmod +x scripts/test-runner-entrypoint.sh scripts/lib/wait-for-http.sh
          docker compose --profile tests up -d mongo mongo-init
          docker compose --profile tests run --rm test-runner

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: backend-test-results
          path: artifacts/test-results/
          if-no-files-found: ignore

  android:
    name: Android lint, unit tests, assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
