# CI: falha se testes backend falharem (contagem TRX), não apenas por existir artefato.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main, "cursor/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & test (Mongo rs0)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          global-json-file: backend/global.json

      - name: Prepare .env for Compose API (test seed)
        run: |
          chmod +x scripts/setup-dev.sh scripts/test-runner-entrypoint.sh scripts/lib/*.sh scripts/lib/*.py
          bash scripts/setup-dev.sh

      - name: Docker Compose — Mongo + test-runner
        run: |
          docker compose --profile tests up -d mongo mongo-init
          set +e
          docker compose --profile tests run --rm test-runner
          TEST_EXIT=$?
          set -e
          sudo chown -R "$(id -u):$(id -g)" artifacts
          python3 scripts/lib/parse-trx-results.py artifacts/test-results artifacts/test-summary.json
          python3 scripts/lib/parse-trx-results.py --check artifacts/test-results
          exit "$TEST_EXIT"

      - name: Upload backend artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: backend-test-artifacts
          path: |
            artifacts/test-results/
            artifacts/coverage/
            artifacts/test-summary.json
            artifacts/test-summary.txt
            artifacts/test-runner.log
          if-no-files-found: warn

  android:
    name: Android lint, unit tests, assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        run: |
          chmod +x gradlew
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  android-journey:
    name: Android E2E journeys (emulator + API)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend]
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Setup Java 17
        uses: actions/setup-java@v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare .env
        run: bash scripts/setup-dev.sh

      - name: API + Mongo
        run: |
          docker compose up -d --build mongo mongo-init api
          if ! bash scripts/lib/wait-for-http.sh http://127.0.0.1:8080/health/ready 200 180 3; then
            docker compose ps --all
            docker compose logs --no-color mongo-init api
            exit 1
          fi

      - name: Build journey APKs
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Run instrumented journeys on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: bash scripts/run-android-journeys.sh "${{ github.sha }}"

      - name: Complete evidence index if emulator setup failed
        if: always()
        run: |
          mkdir -p artifacts/android-journey
          if [ ! -f artifacts/EVIDENCE_INDEX.md ]; then
            python3 scripts/lib/write-evidence-index.py \
              --android-dir artifacts/android-journey \
              --out artifacts/EVIDENCE_INDEX.md \
              --instrument-exit 1 || true
          fi

      - name: Upload Android journey artifacts
        if: always()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: android-journey-evidence
          path: |
            artifacts/android-journey/
            artifacts/EVIDENCE_INDEX.md
          if-no-files-found: ignore
